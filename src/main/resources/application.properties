spring.application.name=knowledge-assistant

# Server configuration
server.port=8080

# PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/knowledge_db
spring.datasource.username=${DB_USERNAME:knowledge_user}
spring.datasource.password=${DB_PASSWORD:knowledge_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.sql.init.mode=always

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local File Storage
app.file.upload-dir=uploads

# Ollama Configuration
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3.2:3b}
ollama.chat-temperature=0.2
